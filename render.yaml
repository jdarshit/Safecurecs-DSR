services:
  - type: web
    name: safecurecs-dsr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py ensure_admin && gunicorn safecurecs_dsr.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_ID
        value: ADMIN001
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@safecurecs.com
      - key: BOOTSTRAP_ADMIN_FIRST_NAME
        value: Safecurecs
      - key: BOOTSTRAP_ADMIN_LAST_NAME
        value: Admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: DJANGO_LOG_LEVEL
        value: "WARNING"
