{% if user.profile_photo %}
    <img src="{{ user.profile_photo.url }}" class="avatar-img {{ size_class|default:'avatar-sm' }}" alt="{{ user.get_full_name }}">
{% else %}
    <div class="avatar-initials {{ size_class|default:'avatar-sm' }}">{{ user.first_name|slice:':1' }}{{ user.last_name|slice:':1' }}</div>
{% endif %}
