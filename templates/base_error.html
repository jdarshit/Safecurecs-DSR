{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error{% endblock %} - Safecurecs DSR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">
    <div class="auth-wrapper d-flex align-items-center justify-content-center">
        <div class="text-center" style="max-width: 480px;">
            <div class="display-3 fw-bold text-primary">{% block error_code %}{% endblock %}</div>
            <h1 class="h4 mb-3">{% block error_title %}{% endblock %}</h1>
            <p class="text-muted mb-4">{% block error_message %}{% endblock %}</p>
            <a href="{% url 'home' %}" class="btn btn-primary">Go to Dashboard</a>
        </div>
    </div>
</body>
</html>
